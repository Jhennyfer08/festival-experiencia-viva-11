<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="O Festival Experiência VIVA é um evento anual realizado com o apoio financeiro da Instituição VIVA, que acredita no poder transformador da arte, da cultura e da educação. Com uma programação gratuita e acessível a toda a comunidade, o festival proporciona momentos de aprendizado, entretenimento e conexão, valorizando a diversidade cultural e ampliando o acesso ao conhecimento."
        />

        <link
            rel="shortcut icon"
            href="/frontend/img/icons/logo.webp"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="/frontend/css/global.css" />
        <link rel="stylesheet" href="/frontend/css/components.css" />

        <script type="module" src="/frontend/js/auth/adminLock.js"></script>
        <script type="module" src="/frontend/js/config/components.js"></script>
        <script type="module" src="/frontend/js/admin/inscriptions.js"></script>

        <title>Festival Experiência Viva</title>
    </head>

    <body>
        <header id="header"></header>
        <nav id="nav" role="navigation"></nav>

        <main id="main">
            <h2>Cadastro de Inscrições</h2>

            <form action="" class="form" id="form">
                <article class="form-group">
                    <label for="id_activity">Atividade:</label>
                    <select name="id_activityInput" id="id_activity">
                        <option value="#" selected disabled>
                            Selecione uma Atividade
                        </option>
                    </select>
                </article>

                <article class="form-group">
                    <label for="id_participant">Participante:</label>
                    <select name="id_participantInput" id="id_participant">
                        <option value="#" selected disabled>
                            Selecione um Participante
                        </option>
                    </select>
                </article>

                <span id="formError"></span>
                <button type="submit" id="submitButton">Cadastrar</button>
            </form>

            <h2>Lista de Inscrições</h2>

            <table>
                <thead>
                    <tr>
                        <th>Atividade</th>
                        <th>Participante</th>
                        <th>Editar</th>
                        <th>Excluir</th>
                    </tr>
                </thead>

                <tbody id="tbody"></tbody>
            </table>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
